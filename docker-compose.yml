services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: pavimento-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pavimento_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pavimento_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
